<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Service commercial</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F3;--surf:#fff;--ink:#14282D;--mut:#55696F;--brand:#0F4C5C;--gold:#F2A30F;--coral:#E4572E;--line:#CBD8DB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1B1F;--surf:#162A30;--ink:#E8F0F2;--mut:#9DB2B8;--brand:#1F7A8F;--line:#2A444C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1B1F;--surf:#162A30;--ink:#E8F0F2;--mut:#9DB2B8;--brand:#1F7A8F;--line:#2A444C;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surf);z-index:10}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;line-height:1.1;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{font:800 20px "Bricolage Grotesque",Georgia,serif;cursor:pointer;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--ink);font:500 15px inherit;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--brand);color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
.stalls{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:28px}
.stall{background:var(--surf);border:1px solid var(--line);border-radius:6px 6px 14px 14px;padding:0 22px 24px;overflow:hidden}
.stall::before{content:"";display:block;height:34px;margin:0 -22px 20px;background:repeating-linear-gradient(90deg,var(--c) 0 30px,var(--surf) 30px 60px);border-bottom:3px solid var(--c)}
.stall h2{font-size:28px;margin-bottom:8px}
.stall p{color:var(--mut);margin:0 0 18px}
.hero h1{font-size:clamp(38px,8vw,64px);font-weight:800}
.hero p{font-size:18px;color:var(--mut);max-width:560px;margin:12px 0 0}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:700 15px inherit;cursor:pointer}
.btn.alt{background:var(--coral)}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.bar input{flex:1;min-width:200px;width:auto}
.chip{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:99px;padding:6px 14px;font:500 14px inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pic{height:96px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:48px}
.card h3{font-size:18px}.mut{color:var(--mut);font-size:14px}
.price{font:800 20px "Bricolage Grotesque",Georgia,serif}
.card .btn{margin-top:auto}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.form label{display:grid;gap:4px;font-weight:500;font-size:14px}
.form .full{grid-column:1/-1}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--gold);color:#14282D}
.tag.ok{background:#2E9E6B;color:#fff}.tag.bad{background:var(--coral);color:#fff}
.shops{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:10px}
.shopc{text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);font:inherit;display:grid;gap:2px}
.shopc.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.acts{margin-top:auto;display:grid;gap:8px}
.card .acts .btn{margin:0;display:block;text-align:center;text-decoration:none}
.btn.wa{background:#1B7F4B;color:#fff}.btn.wa small{font-weight:500;font-size:13px}
.edit{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.edit label{display:grid;gap:2px;font-size:13px;font-weight:500}
.edit input{width:96px;padding:8px 10px}
.cover{aspect-ratio:3/1;border-radius:14px;background:var(--line) center/cover no-repeat;display:grid;place-items:center;overflow:hidden}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--bg) center/cover no-repeat;border:3px solid var(--surf);display:grid;place-items:center;font-size:36px;flex:none}
.avatar.mini{width:40px;height:40px;font-size:20px;border-width:1px;border-color:var(--line)}
.shophead{margin-bottom:12px}.shophead .avatar{margin:-42px 0 8px 14px;position:relative}
.thumb{height:44px;border-radius:6px;vertical-align:middle;margin-right:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<header>
  <div class="logo" onclick="logoTap()">Service commercial</div>
  <nav>
    <button data-v="market" onclick="go('market')">Marché</button>
    <button data-v="dash" onclick="go('dash')">Ma boutique</button>
    
  </nav>
</header>
<main id="main"></main>
<div id="toast" role="status"></div>
<script>
const DEVISE='FCFA';
const FREE=10;
const CATS=['Alimentation','Mode','Maison','Beauté','Électronique','Autre'];
const ICO={Alimentation:'🍎',Mode:'👕',Maison:'🏠',Beauté:'💄',Électronique:'📱',Autre:'📦'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>(document.getElementById(id)||{value:''}).value.trim();
const money=n=>Number(n).toLocaleString('fr-FR')+' '+DEVISE;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
const opts=(a,sel)=>a.map(x=>`<option${x===sel?' selected':''}>${x}</option>`).join('');

const V={
home:()=>`<section class="hero"><h1>Service commercial</h1><p>Le marché en ligne où les boutiques vendent leurs produits et où les clients passent commande.</p></section>
<div class="stalls">
 <div class="stall" style="--c:var(--brand)"><h2>Créer une boutique</h2><p>Boutique de détail ou entreprise grossiste : créez un compte, ouvrez votre boutique et mettez vos produits en vente.</p><button class="btn" onclick="go('create')">Créer une boutique</button></div>
 <div class="stall" style="--c:var(--coral)"><h2>Client</h2><p>Parcourez les produits des boutiques et commandez directement sur WhatsApp. Les commerçants peuvent acheter en gros chez les grossistes.</p><button class="btn alt" onclick="go('market')">Voir les produits</button></div>
</div>`,

market:()=>`<h2>Marché</h2>
<div class="bar"><button class="chip${S.mode==='detail'?' on':''}" onclick="setMode('detail')">Achat en détail</button><button class="chip${S.mode==='gros'?' on':''}" onclick="setMode('gros')">Achat en gros (grossistes)</button></div>
<div class="bar"><input id="q" type="search" placeholder="Rechercher un produit ou une boutique" value="${esc(S.q)}" oninput="S.q=this.value;document.getElementById('grid').innerHTML=gridHTML();document.getElementById('shopsBox').innerHTML=shopsHTML()"></div>
<h3 style="margin-top:18px">${S.mode==='gros'?'Grossistes':'Boutiques'}</h3><div class="shops" id="shopsBox">${shopsHTML()}</div>
<div style="margin:16px 0">${S.shopF&&mshop(S.shopF)?shopHead(mshop(S.shopF))+'<h3>'+esc(mshop(S.shopF).name)+'</h3>':''}</div>
<div class="bar" style="margin-top:-6px">${['Tous',...CATS].map(c=>`<button class="chip${S.cat===c?' on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div>
<div class="grid" id="grid">${gridHTML()}</div>`,

pay:()=>{
  const a=account(S.user);if(!a)return V.home();
  const t=accType(a),pl=a.aboPlan==='an'?'an':'mois';
  return `<h2>Paiement de l’abonnement</h2><div class="panel"><p>Vous avez choisi l’abonnement <strong>${t==='gros'?'grossiste':'boutique de détail'} ${pl==='an'?'annuel':'mensuel'}</strong> : <strong>${fcfa(S.abo[t][pl])}</strong>.</p><p>Pour payer et réactiver votre boutique, contactez l’administration sur WhatsApp : <strong>+${esc(S.adminWa)}</strong>.</p><p><a class="btn wa" style="display:inline-block;text-decoration:none" href="${waAdmin(a)}" target="_blank" rel="noopener">Prendre l’administration sur WhatsApp</a></p><p><button class="btn ghost" onclick="go('abo')">Retour</button></p></div>`;
},

abo:()=>{
  const a=account(S.user)||{};
  return `<h2>Abonnement requis</h2><div class="panel"><p>Votre boutique est bloquée. Passez à l’abonnement pour la réactiver.</p>${aboPrice(a)}${a.aboAsked?'<p><span class="tag">Demande envoyée</span> Formule choisie : '+(a.aboPlan==='an'?'annuelle':'mensuelle')+'. L’administration va vous répondre.</p><p><button class="btn wa" onclick="go(\'pay\')">Payer via WhatsApp</button></p>':'<p class="bar"><button class="btn" onclick="askAbo(\'mois\')">Demander l’abonnement mensuel</button><button class="btn alt" onclick="askAbo(\'an\')">Demander l’abonnement annuel</button></p>'}<p><button class="btn ghost" onclick="logout()">Se déconnecter</button></p></div>`;
},

auth:()=>`<h2>Compte boutique</h2><p class="mut">Pour ouvrir une boutique, créez d’abord un compte. L’administration le vérifie avant que vos produits apparaissent sur le marché.</p>
<div class="panel"><h3>Créer un compte</h3><div class="form" style="margin-top:14px"><label>Nom complet<input id="an" autocomplete="name"></label><label>Téléphone<input id="at" type="tel"></label><label>E-mail<input id="ae" type="email" autocomplete="email"></label><label>Mot de passe (6 caractères minimum)<input id="ap" type="password" autocomplete="new-password"></label></div><p><button class="btn" onclick="register()">Créer mon compte</button></p></div>
<div class="panel"><h3>J’ai déjà un compte</h3><div class="form" style="margin-top:14px"><label>E-mail<input id="le" type="email" autocomplete="email"></label><label>Mot de passe<input id="lp" type="password" autocomplete="current-password"></label></div><p class="bar"><button class="btn ghost" onclick="login()">Me connecter</button><button class="btn ghost" onclick="forgot()">Mot de passe oublié ?</button></p></div>`,

adminlogin:()=>`<h2>Administration</h2><div class="panel"><p>Connectez-vous avec le compte administrateur.</p><div class="form"><label>E-mail<input id="l-e" type="email" autocomplete="email"></label><label>Mot de passe<input id="l-pw" type="password" autocomplete="current-password"></label></div><p><button class="btn" onclick="adminLogin()">Entrer</button></p></div>`,

account:()=>{
  const me=account(S.user);if(!me)return V.auth();
  const pwPanel=`<div class="panel"><h3>${S.recovery?'Choisir un nouveau mot de passe':'Changer mon mot de passe'}</h3><div class="form" style="margin-top:14px">${S.recovery?'':'<label>Mot de passe actuel<input id="pw0" type="password" autocomplete="current-password"></label>'}<label>Nouveau mot de passe (8 caractères minimum)<input id="pw1" type="password" autocomplete="new-password"></label><label>Confirmer le nouveau mot de passe<input id="pw2" type="password" autocomplete="new-password"></label></div><p><button class="btn" onclick="changePw()">Enregistrer le mot de passe</button></p></div>`;
  if(S.recovery)return `<h2>Mon compte</h2><p class="mut">Vous avez demandé la réinitialisation de votre mot de passe.</p>${pwPanel}`;
  const M=mine(),s=M.length?(shop(S.me)&&shop(S.me).ownerId===S.user?shop(S.me):M[0]):null;
  return `<h2>Mon compte</h2><div class="bar"><button class="btn ghost" onclick="go('dash')">Retour à ma boutique</button></div>
  <div class="panel"><h3>Mes informations</h3><div class="form" style="margin-top:14px"><label>Nom complet<input id="mn" value="${esc(me.name)}" autocomplete="name"></label><label>Téléphone<input id="mt" type="tel" value="${esc(me.phone)}"></label><label class="full">E-mail de connexion<input value="${esc(me.email)}" disabled></label></div><p><button class="btn" onclick="saveProfile()">Enregistrer</button></p></div>
  ${pwPanel}
  ${s?photoPanel(s):''}
  ${s?`<div class="panel"><h3>Informations de la boutique</h3>${M.length>1?`<select style="max-width:260px;margin-top:10px" onchange="S.me=this.value;render()">${M.map(m=>`<option value="${m.id}"${m.id===s.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select>`:''}<p class="mut">${typeLabel(s)} (le type ne peut pas être changé)</p><div class="form"><label>Nom de la boutique<input id="sn" value="${esc(s.name)}"></label><label>Pays<input id="sy" value="${esc(s.country)}"></label><label>Ville ou quartier<input id="sc" value="${esc(s.city)}"></label><label>Numéro WhatsApp (avec l’indicatif)<input id="sp" type="tel" value="${esc(s.phone)}"></label><label>Catégorie principale<select id="sk">${opts(CATS,s.cat)}</select></label><label class="full">Description<textarea id="sd" rows="3">${esc(s.desc)}</textarea></label></div><p><button class="btn" onclick="saveShop()">Enregistrer la boutique</button></p></div>`:''}`;
},

setup:()=>`<h2>Configuration du serveur</h2><div class="panel"><p>Le serveur n’est pas encore relié. Ouvrez ce fichier et remplissez <strong>CFG.url</strong> et <strong>CFG.key</strong> avec les valeurs de votre projet Supabase (voir le guide <strong>INSTALLATION.md</strong>).</p></div>`,

admin:()=>{
  const A=S.accounts.filter(a=>!a.isAdmin),c=s=>A.filter(a=>a.status===s).length,aq=(S.aq||'').toLowerCase(),F=A.filter(a=>!aq||(a.name+' '+a.email+' '+(a.phone||'')+' '+S.shops.filter(x=>x.ownerId===a.id).map(x=>x.name).join(' ')).toLowerCase().includes(aq)).sort((x,y)=>subLeft(x)-subLeft(y));
  return `<h2>Administration</h2><p class="mut">${A.length} comptes · ${c('En attente')} à vérifier · ${c('Vérifié')} vérifiés · ${c('Refusé')} refusés</p>
  <div class="bar"><button class="btn ghost" onclick="logout()">Quitter l’administration</button><button class="btn ghost" onclick="exportData()">Sauvegarder les données</button></div>
  <div class="panel"><h3>Abonnement</h3><div class="edit" style="margin-top:12px"><strong style="width:100%">Boutiques de détail</strong><label>Prix par mois (FCFA)<input id="ab-dm" type="number" min="0" step="any" value="${S.abo.detail.mois}"></label><label>Prix par an (FCFA)<input id="ab-da" type="number" min="0" step="any" value="${S.abo.detail.an}"></label></div>
  <div class="edit" style="margin-top:12px"><strong style="width:100%">Grossistes</strong><label>Prix par mois (FCFA)<input id="ab-gm" type="number" min="0" step="any" value="${S.abo.gros.mois}"></label><label>Prix par an (FCFA)<input id="ab-ga" type="number" min="0" step="any" value="${S.abo.gros.an}"></label></div>
  <div class="edit" style="margin-top:12px"><label>WhatsApp de l’administration (avec indicatif)<input id="ab-wa" type="tel" value="${esc(S.adminWa)}"></label></div><p><button class="btn" onclick="setPrice()">Enregistrer</button></p></div>
  <div class="panel"><h3>Comptes boutiques</h3><div class="bar"><input id="aq" type="search" placeholder="Rechercher un compte (nom, e-mail, téléphone, boutique)" value="${esc(S.aq||'')}" oninput="S.aq=this.value;render();const i=document.getElementById('aq');i.focus();i.setSelectionRange(i.value.length,i.value.length)"></div>${F.length?F.map(a=>{const sh=S.shops.filter(s=>s.ownerId===a.id);return `<div class="row"><div><strong>${esc(a.name)}</strong> · ${esc(a.email)}${a.phone?' · '+esc(a.phone):''}<div class="mut">Inscrit le ${a.date} · ${sh.length?sh.map(s=>esc(s.name)+' – '+typeLabel(s)+(s.country?' – '+esc(s.country):'')+' ('+S.products.filter(p=>p.shopId===s.id).length+' produits)').join(', '):'aucune boutique'}</div><div class="mut">${aboLine(a)}</div>${subLine(a)}${adminPhotos(sh)}</div>
  <div style="text-align:right"><span class="tag${a.status==='Vérifié'?' ok':a.status==='Refusé'?' bad':''}">${a.status}</span><div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end">${a.status!=='Vérifié'?`<button class="btn" onclick="setStatus('${a.id}','Vérifié')">Vérifier</button>`:''}${a.status!=='Refusé'?`<button class="btn ghost" onclick="setStatus('${a.id}','Refusé')">Refuser</button>`:''}<button class="btn ghost" onclick="${a.blocked?`pickSub('${a.id}')`:`toggleBlock('${a.id}')`}">${a.blocked?'Débloquer':'Bloquer'}</button><button class="btn ghost" onclick="${a.sub?`toggleSub('${a.id}')`:`pickSub('${a.id}')`}">${a.sub?'Retirer l’abonnement':'Activer l’abonnement'}</button></div>${S.pick===a.id?`<div class="panel" style="margin-top:8px;text-align:left"><strong>Durée de l’abonnement payé</strong>${a.aboAsked?`<div class="mut">Demande du client : ${a.aboPlan==='an'?'annuel':'mensuel'}</div>`:''}<div class="bar"><button class="btn" onclick="startSub('${a.id}','mois')">Par mois (30 jours)</button><button class="btn alt" onclick="startSub('${a.id}','an')">Par an (365 jours)</button><button class="btn ghost" onclick="pickSub('${a.id}')">Annuler</button></div></div>`:''}</div></div>`}).join(''):'<p class="mut">'+(A.length?'Aucun compte trouvé.':'Aucun compte pour le moment.')+'</p>'}</div>`;
},

create:()=>`<h2>Créer une boutique</h2><div class="panel"><div class="form">
<label class="full">Type de boutique<select id="st"><option value="detail">Boutique de détail : vente aux clients à l’unité</option><option value="gros">Entreprise grossiste : vente en gros aux commerçants</option></select></label>
<label>Nom de la boutique<input id="sn"></label><label>Votre nom<input id="so" autocomplete="name"></label>
<label>Pays de la boutique<input id="sy" autocomplete="country-name"></label><label>Ville ou quartier<input id="sc"></label><label>Numéro WhatsApp (avec l’indicatif du pays)<input id="sp" type="tel" placeholder="ex. 33612345678"></label>
<label>Catégorie principale<select id="sk">${opts(CATS)}</select></label>
<label class="full">Description<textarea id="sd" rows="3"></textarea></label></div>
<p><button class="btn" onclick="makeShop()">Créer ma boutique</button></p></div>`,

dash:()=>{
  const M=mine();
  if(!M.length)return `<h2>Ma boutique</h2><div class="panel"><p>Vous n’avez pas encore de boutique.</p><button class="btn" onclick="go('create')">Créer ma boutique</button></div>`;
  if(!shop(S.me)||shop(S.me).ownerId!==S.user)S.me=M[0].id;
  const ac=account(S.user);if(!ac){S.user=null;return V.auth()}const ref=ac.status==='Refusé';
  const ban=ac.status==='Vérifié'?'':`<div class="panel" style="border-color:${ref?'var(--coral)':'var(--gold)'}"><strong>${ref?'Votre compte a été refusé.':'Votre compte est en attente de vérification.'}</strong><div class="mut">${ref?'Vos produits ne sont pas visibles sur le marché.':'Vous pouvez préparer vos produits ; ils apparaîtront sur le marché dès la vérification.'}</div></div>`;
  const s=shop(S.me),P=S.products.filter(p=>p.shopId===s.id);
  return `${shopHead(s)}<h2>${esc(s.name)}</h2><p class="mut">${typeLabel(s)} · ${esc([s.city,s.country].filter(Boolean).join(', '))} · ${esc(s.cat)}</p>${ban}
  <div class="bar">${M.length>1?`<select style="max-width:260px" onchange="S.me=this.value;render()">${M.map(m=>`<option value="${m.id}"${m.id===s.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select>`:''}<button class="btn ghost" onclick="go('account')">Mon compte</button><button class="btn ghost" onclick="go('create')">Ajouter une autre boutique</button><button class="btn ghost" onclick="logout()">Se déconnecter</button></div>
  <div class="panel"><h3>Ajouter un produit</h3><div class="form" style="margin-top:14px">
  <label>Nom du produit<input id="pn"></label><label>Prix ${s.type==='gros'?'unitaire en gros':'à l’unité'} (${DEVISE})<input id="pp" type="number" min="0" step="any"></label>

/* Recadre au centre et compresse la photo avant l’envoi */
function shrink(file,w,h){
  return new Promise((ok,ko)=>{
    const u=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.max(w/img.width,h/img.height),sw=w/k,sh=h/k,c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(Math.min(w,sw)));c.height=Math.max(1,Math.round(c.width*h/w));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      x.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,c.width,c.height);
      URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(),'image/jpeg',0.8);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);ko()};img.src=u;
  });
}

    S.draft={shopId,kind,blob,url:URL.createObjectURL(blob)};
    render();toast('Vérifiez l’aperçu puis appuyez sur Enregistrer');

}
async function delProd(id){if(!confirm('Retirer ce produit de la vente ?'))return;await db(sb.from('products').delete().eq('id',id))}

/* --- Abonnements --- */
async function askAbo(plan){const pl=plan==='an'?'an':'mois';if(await db(sb.from('profiles').update({abo_asked:true,abo_plan:pl}).eq('id',S.user)))go('pay')}
function waAdmin(a){const t=accType(a),pl=a.aboPlan==='an'?'an':'mois',pr=S.abo[t][pl];const sh=S.shops.filter(s=>s.ownerId===a.id).map(s=>s.name).join(', ');
  return 'https://wa.me/'+S.adminWa+'?text='+encodeURIComponent('Bonjour, je souhaite payer mon abonnement '+(t==='gros'?'grossiste':'boutique de détail')+' ('+(pl==='an'?'annuel':'mensuel')+') : '+fcfa(pr)+'. Compte : '+a.name+' ('+a.email+')'+(sh?' · Boutique : '+sh:'')+'.')}
async function setPrice(){
  const v={detail:{mois:parseFloat($('ab-dm')),an:parseFloat($('ab-da'))},gros:{mois:parseFloat($('ab-gm')),an:parseFloat($('ab-ga'))}},wa=$('ab-wa').replace(/\D/g,'');
  if([v.detail.mois,v.detail.an,v.gros.mois,v.gros.an].some(x=>isNaN(x)||x<0))return toast('Indiquez des prix valides en FCFA.');
  if(wa.length<8)return toast('Indiquez un numéro WhatsApp valide avec l’indicatif.');
  await db(sb.from('settings').update({abo:v,admin_wa:wa}).eq('id',1),'Réglages enregistrés');
}

/* --- Administration --- */
async function setStatus(id,st){await db(sb.from('profiles').update({status:st}).eq('id',id),'Compte '+st.toLowerCase())}
async function startSub(id,plan){S.pick=null;await db(sb.from('profiles').update({sub:true,blocked:false,abo_asked:false,sub_plan:plan,sub_total:plan==='an'?365:30,sub_start:new Date().toISOString()}).eq('id',id),'Compte débloqué : abonnement '+(plan==='an'?'annuel':'mensuel'))}
async function toggleBlock(id){const a=account(id),b=!a.blocked;await db(sb.from('profiles').update(b?{blocked:true,sub:false,sub_start:null}:{blocked:false}).eq('id',id),b?'Boutique bloquée':'Boutique débloquée')}
async function toggleSub(id){await db(sb.from('profiles').update({sub:false,sub_start:null}).eq('id',id),'Abonnement retiré')}

/* --- Démarrage --- */
if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){S.recovery=true;setTimeout(()=>refresh().then(()=>go('account')),0)}});
render();
(async()=>{if(!sb){go('setup');return}await refresh();render()})();
</script>
</body>
